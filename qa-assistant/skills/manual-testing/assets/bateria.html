<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bateria de testes manuais</title>
<style>
:root{font-family:system-ui,sans-serif;color:#172333;background:#eef2f7}body{max-width:1000px;margin:auto;padding:24px}h1{margin-bottom:4px}header,.case,.info{background:white;border:1px solid #ccd6e2;border-radius:10px;padding:20px;margin-bottom:16px}header{border-top:5px solid #2563eb}.muted{color:#526174}button,select,textarea{font:inherit}button{background:#1d4ed8;color:white;border:0;border-radius:6px;padding:10px 16px;cursor:pointer}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f59e0b}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.case h2{font-size:1.2rem;margin:0 0 8px}.case li{margin:8px 0}.fields{display:grid;grid-template-columns:200px 1fr;gap:16px}label{display:block;font-weight:600;margin-bottom:5px}select,textarea{box-sizing:border-box;width:100%;border:1px solid #94a3b8;border-radius:5px;padding:8px;background:white;color:#172333}textarea{min-height:72px;resize:vertical}.print-value{display:none;white-space:pre-wrap}.warning{color:#9a3412}footer{font-size:.9rem;color:#526174}@media(max-width:600px){body{padding:12px}.fields{grid-template-columns:1fr}}@media print{body{padding:0;background:white;font-size:10pt}header,.case,.info{border:1px solid #aaa;break-inside:avoid;margin-bottom:10px;padding:12px}button,select,textarea,.screen-only{display:none!important}.print-value{display:block}h1{font-size:20pt}a{color:inherit;text-decoration:none}}
</style></head><body>
<header><h1 id="titulo"></h1><p id="contexto" class="muted"></p><div class="toolbar"><button type="button" onclick="window.print()">Exportar PDF</button><span id="progresso" aria-live="polite"></span></div><p class="screen-only muted">Para gerar o PDF, escolha “Salvar como PDF” na janela de impressão. Os registros ficam neste navegador e perfil.</p><p id="erro" class="warning" role="alert"></p></header>
<section class="info"><h2>Preparação</h2><p id="preparo"></p><h2>Cobertura e limitações</h2><p id="cobertura"></p></section><main id="casos"></main><footer>O PDF apresenta os resultados e as observações visíveis no momento da impressão.</footer>
<script id="dados-bateria" type="application/json">
{"id":"exemplo-substituir","titulo":"Exemplo — substituir pela bateria","contexto":"Exemplo; substitua por alteração e ambiente reais.","preparo":"Informe ambiente, acesso e dados de teste.","cobertura":"Informe o escopo e as dúvidas conhecidas.","casos":[{"id":"CT-01","titulo":"Exemplo de cenário","prioridade":"Alta","precondicoes":"Informe a condição inicial.","passos":[{"acao":"Abra a tela indicada.","esperado":"A tela é exibida."}]}]}
</script>
<script>
(function(){'use strict';
const data=JSON.parse(document.getElementById('dados-bateria').textContent);const key='qa-assistant:'+data.id;let saved={};const error=document.getElementById('erro');try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){error.textContent='Não foi possível ler os registros locais. Use o PDF para guardar os resultados.'}
const set=(id,value)=>document.getElementById(id).textContent=value;set('titulo',data.titulo);set('contexto',data.contexto);set('preparo',data.preparo);set('cobertura',data.cobertura);document.title=data.titulo;
const statuses=['Não iniciado','Aprovado','Reprovado','Bloqueado','Não aplicável'];const container=document.getElementById('casos');const controls=[];
function element(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}
function save(){const values={};for(const c of controls)values[c.id]={status:c.select.value,nota:c.note.value};try{localStorage.setItem(key,JSON.stringify(values))}catch(e){error.textContent='Não foi possível salvar neste navegador. Exporte o PDF antes de fechar a página.'}update()}
function update(){let n=0;for(const c of controls){if(c.select.value!=='Não iniciado')n++;c.statusPrint.textContent=c.select.value;c.notePrint.textContent=c.note.value||'Sem observações';}set('progresso',n+' de '+controls.length+' casos registrados');}
data.casos.forEach((item,i)=>{const section=element('section');section.className='case';section.append(element('h2',item.id+' — '+item.titulo),element('p','Prioridade: '+item.prioridade),element('p','Pré-condições: '+item.precondicoes));const ol=element('ol');item.passos.forEach(step=>{const li=element('li');li.append(element('div',step.acao),element('div','Resultado esperado: '+step.esperado));ol.append(li)});section.append(ol);const fields=element('div');fields.className='fields';const a=element('div'),b=element('div');const ls=element('label','Resultado');ls.htmlFor='status-'+i;const sel=element('select');sel.id=ls.htmlFor;statuses.forEach(s=>{const o=element('option',s);o.value=s;sel.append(o)});const ln=element('label','Observações');ln.htmlFor='nota-'+i;const note=element('textarea');note.id=ln.htmlFor;note.placeholder='Registre evidências, falhas ou impedimentos';const sp=element('div');sp.className='print-value';const np=element('div');np.className='print-value';a.append(ls,sel,sp);b.append(ln,note,np);fields.append(a,b);section.append(fields);container.append(section);const old=saved[item.id]||{};sel.value=statuses.includes(old.status)?old.status:'Não iniciado';note.value=old.nota||'';controls.push({id:item.id,select:sel,note,statusPrint:sp,notePrint:np});sel.addEventListener('change',save);note.addEventListener('input',save)});update();
})();
</script></body></html>
